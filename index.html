<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiju Cleaners</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4e8; font-family: ui-monospace, Menlo, Consolas, monospace; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; top: 10px; color: #fff; font-size: 12px; line-height: 1.5; background: rgba(20, 24, 32, 0.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #help { position: fixed; left: 10px; bottom: 10px; color: #fff; font-size: 12px; line-height: 1.5; background: rgba(20, 24, 32, 0.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(20, 24, 32, 0.85); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      #note { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); width: min(640px, 80vw); display: none; background: rgba(20, 24, 32, 0.92); padding: 14px; border-radius: 8px; color: #fff; font-size: 13px; }
      #note input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px; font: inherit; font-size: 14px; border-radius: 4px; border: 1px solid #556; background: #111; color: #fff; }
      #gauge { position: fixed; left: 26px; top: 50%; transform: translateY(-50%); display: none; align-items: center; gap: 14px; pointer-events: none; color: #fff; }
      #gauge canvas { display: block; }
      #gauge div { font-size: 30px; font-weight: bold; line-height: 1.15; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); white-space: pre; }
      #gauge small { display: block; font-size: 13px; font-weight: normal; opacity: 0.9; }
      #banner { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); display: none; text-align: center; color: #fff; font-size: 30px; font-weight: bold; background: rgba(20, 24, 32, 0.8); padding: 16px 28px; border-radius: 10px; pointer-events: none; white-space: pre; }
      #banner small { display: block; font-size: 14px; font-weight: normal; margin-top: 8px; }
      #approval { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: bold; background: rgba(20, 24, 32, 0.6); padding: 6px 12px; border-radius: 6px; pointer-events: none; }
      #approval b { display: block; width: 200px; height: 10px; background: rgba(255, 255, 255, 0.18); border-radius: 5px; overflow: hidden; }
      #approval i { display: block; height: 100%; width: 50%; background: #7dff9a; transition: width 0.3s; }
      #modebar { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: bold; background: rgba(20, 24, 32, 0.7); padding: 7px 12px; border-radius: 6px; pointer-events: none; }
      #modebar b { display: block; width: 180px; height: 10px; background: rgba(255, 255, 255, 0.18); border-radius: 5px; overflow: hidden; }
      #modebar i { display: block; height: 100%; width: 100%; background: #7dff9a; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="boot">Loading…</div>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="toast"></div>
    <div id="gauge"><canvas width="64" height="300"></canvas><div></div></div>
    <div id="approval"><span></span><b><i></i></b></div>
    <div id="banner"></div>
    <div id="modebar"><span></span><b><i></i></b></div>
    <div id="note">Note for Claude: what just happened, or how it feels. Enter to save, Esc to cancel.<input type="text" maxlength="400" /></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
