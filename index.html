<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiju Cleaners</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%239fc4e8'/%3E%3Cpath d='M9 27V13a7 7 0 0 1 14 0v14z' fill='%233c8463'/%3E%3Ccircle cx='13' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='19' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='13.4' cy='12.4' r='1.1'/%3E%3Ccircle cx='19.4' cy='12.4' r='1.1'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4e8; font-family: ui-monospace, Menlo, Consolas, monospace; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; top: 10px; color: #fff; font-size: 12px; line-height: 1.5; background: rgba(20, 24, 32, 0.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #help { position: fixed; left: 10px; bottom: 30px; color: #fff; font-size: 12px; line-height: 1.5; background: rgba(20, 24, 32, 0.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(20, 24, 32, 0.85); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      #note { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); width: min(640px, 80vw); display: none; background: rgba(20, 24, 32, 0.92); padding: 14px; border-radius: 8px; color: #fff; font-size: 13px; }
      #note input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px; font: inherit; font-size: 14px; border-radius: 4px; border: 1px solid #556; background: #111; color: #fff; }
      /* The grip bar: placed by the game just above whatever the kaiju is holding. */
      #grip { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -100%); display: none; pointer-events: none; text-align: center; color: #fff; }
      #grip canvas { display: block; }
      #grip div { margin-top: 2px; font-size: 16px; font-weight: bold; text-shadow: 0 2px 5px rgba(0, 0, 0, 0.85); white-space: pre; min-height: 20px; }
      #banner { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); display: none; text-align: center; color: #fff; font-size: 30px; font-weight: bold; background: rgba(20, 24, 32, 0.8); padding: 16px 28px; border-radius: 10px; pointer-events: none; white-space: pre; }
      #banner small { display: block; font-size: 14px; font-weight: normal; margin-top: 8px; }
      #approval { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: bold; background: rgba(20, 24, 32, 0.6); padding: 6px 12px; border-radius: 6px; pointer-events: none; }
      #approval b { display: block; width: 200px; height: 10px; background: rgba(255, 255, 255, 0.18); border-radius: 5px; overflow: hidden; }
      #approval i { display: block; height: 100%; width: 50%; background: #7dff9a; transition: width 0.3s; }
      #modebar { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; color: #fff; font-size: 13px; font-weight: bold; background: rgba(20, 24, 32, 0.7); padding: 7px 12px; border-radius: 6px; pointer-events: none; }
      #modebar b { display: block; width: 180px; height: 10px; background: rgba(255, 255, 255, 0.18); border-radius: 5px; overflow: hidden; }
      #modebar i { display: block; height: 100%; width: 100%; background: #7dff9a; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; line-height: 1.6; text-align: center; white-space: pre-line; padding: 0 24px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
      .gh { position: fixed; inset: 0; pointer-events: none; color: #fff; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; z-index: 3; }
      .gh-jobs { position: absolute; right: 14px; top: 14px; width: 238px; background: rgba(16, 20, 28, 0.62); border-radius: 10px; padding: 8px 10px; font-size: 13px; backdrop-filter: blur(4px); }
      .gh-head { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.08em; opacity: 0.85; padding: 2px 2px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 4px; }
      .gh-row { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
      .gh-row i { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); flex: none; }
      .gh-row span { flex: 1; }
      .gh-row em { font-style: normal; opacity: 0.75; font-size: 12px; }
      .gh-done { opacity: 0.45; }
      .gh-done em { color: #7dff9a; opacity: 1; }
      .gh-active { background: rgba(255, 255, 255, 0.14); border-radius: 5px; }
      .gh-active em { color: #ffd23f; opacity: 1; }
      .gh-map { position: absolute; right: 14px; bottom: 14px; width: 220px; height: 220px; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.35); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35); opacity: 0.92; }
      .gh-arrow { position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: rgba(16, 20, 28, 0.72); border: 2px solid var(--c); border-radius: 14px; padding: 3px 9px; white-space: nowrap; will-change: transform; }
      .gh-arrow i { display: none; width: 0; height: 0; border-left: 11px solid var(--c); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
      .gh-arrow.gh-edge i { display: block; }
      .gh-float { position: absolute; left: 0; top: 0; font-size: 17px; font-weight: 800; color: #9dffb2; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 10px rgba(0, 0, 0, 0.5); white-space: nowrap; will-change: transform; }
      .gh-float.gh-bad { color: #ff8d7a; }
      .gh-float.gh-big { font-size: 26px; }
      .gh-coach { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); max-width: min(680px, 70vw); text-align: center; font-size: 15px; font-weight: 600; background: rgba(16, 20, 28, 0.72); padding: 8px 16px; border-radius: 18px; opacity: 0; transition: opacity 0.5s; }
      .gh-overlay { position: absolute; inset: 0; display: none; place-items: center; background: radial-gradient(ellipse at center, rgba(10, 14, 24, 0.35), rgba(10, 14, 24, 0.75)); pointer-events: auto; }
      .gh-card { width: min(560px, 88vw); background: rgba(18, 23, 34, 0.9); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 18px; padding: 26px 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); text-align: center; }
      .gh-card h1 { margin: 2px 0 8px; font-size: 40px; letter-spacing: -0.01em; }
      .gh-kicker { font-size: 12px; letter-spacing: 0.22em; color: #ffc928; font-weight: 700; }
      .gh-lede { margin: 0 auto 16px; max-width: 440px; font-size: 15px; line-height: 1.45; opacity: 0.9; }
      .gh-todo { display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: center; margin-bottom: 16px; font-size: 13px; }
      .gh-todo b { width: 100%; font-size: 11px; letter-spacing: 0.16em; opacity: 0.7; text-transform: uppercase; }
      .gh-todo span { background: rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 3px 10px; }
      .gh-keys { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 10px; text-align: left; font-size: 13px; margin: 0 auto 18px; max-width: 470px; align-items: center; }
      .gh-keys kbd { font: inherit; font-weight: 700; background: rgba(255, 255, 255, 0.14); border-radius: 6px; padding: 2px 8px; text-align: center; white-space: nowrap; }
      .gh-keys span { opacity: 0.85; }
      .gh-go { font: inherit; font-size: 16px; font-weight: 800; color: #1a1300; background: #ffc928; border: 0; border-radius: 12px; padding: 11px 22px; cursor: pointer; }
      .gh-go:hover { filter: brightness(1.08); }
      .gh-quiet { background: rgba(255, 255, 255, 0.14); color: #fff; font-weight: 600; font-size: 14px; }
      .gh-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .gh-small { margin-top: 12px; font-size: 12px; opacity: 0.6; }
      .gh-stars { font-size: 34px; color: #ffc928; letter-spacing: 6px; margin-bottom: 4px; }
      .gh-stats { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 5px 14px; text-align: left; font-size: 13px; margin: 0 auto 20px; max-width: 440px; }
      .gh-stats span { opacity: 0.75; }
      .ch { position: fixed; inset: 0; pointer-events: none; color: #fff; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; z-index: 3; }
      .ch-top { position: absolute; left: 30%; top: 10px; transform: translateX(-50%); text-align: center; }
      .ch-clock { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); line-height: 1; }
      .ch-clock.ch-done { color: #7dff9a; }
      .ch-leg { margin-top: 6px; font-size: 15px; font-weight: 600; background: rgba(16, 20, 28, 0.7); padding: 6px 14px; border-radius: 16px; display: inline-block; }
      .ch-splits { position: absolute; left: 14px; top: 96px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
      .ch-splits span { background: rgba(16, 20, 28, 0.62); padding: 3px 9px; border-radius: 8px; }
      .ch-splits .ch-hit { color: #ffb38a; }
      .ch-card { width: min(620px, 92vw); }
      .ch-table { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 4px 12px; text-align: left; font-size: 13px; margin: 0 auto 16px; max-width: 520px; font-variant-numeric: tabular-nums; }
      .ch-table b { font-size: 11px; letter-spacing: 0.08em; opacity: 0.65; text-transform: uppercase; }
      .ch-history { border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 12px; }
      .ch-best { color: #7dff9a; font-weight: 700; }
      .ch-now { color: #ffd23f; }
      body.panel-on .dev-tool { display: flex !important; }
      /* Whether the game has hold of the mouse, and how to get it back: small, along the bottom edge, under the kaiju's feet. */
      #mousechip { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); white-space: nowrap; display: none; color: #fff; font-size: 12px; background: rgba(20, 24, 32, 0.7); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
      body.mouse-held #mousechip { background: rgba(190, 120, 20, 0.85); font-weight: bold; }
      #hint { position: fixed; left: 12px; bottom: 10px; color: #fff; font-size: 11px; opacity: 0.6; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); pointer-events: none; }
      body.dev-off #hud, body.dev-off .dev-tool { display: none; }
      body.help-off #help { display: none; }
    </style>
    <script>
      // If the game's code cannot be fetched, say why instead of sitting on "Loading…".
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          var boot = document.getElementById('boot');
          if (!boot || !t || t.tagName !== 'SCRIPT') return;
          boot.textContent = /\/src\/main\.ts$/.test(t.src)
            ? 'This is the unbuilt source, not the game.\n' +
              'GitHub Pages is publishing the repository itself instead of the built game.\n' +
              'Fix: repo Settings → Pages → Source → "GitHub Actions", then re-run the "Deploy to GitHub Pages" workflow.'
            : "The game's code did not load. A new version may be deploying.\nWait a minute, then reload (Ctrl+Shift+R or Cmd+Shift+R).";
        },
        true,
      );
    </script>
  </head>
  <body class="dev-off help-off">
    <div id="boot">Loading…</div>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="hint">H: controls   N: note for Claude   `: tuning &amp; feedback tools</div>
    <div id="toast"></div>
    <div id="mousechip"></div>
    <div id="grip"><canvas width="360" height="54"></canvas><div></div></div>
    <div id="approval"><span></span><b><i></i></b></div>
    <div id="modebar"><span></span><b><i></i></b></div>
    <div id="note">Note for Claude: what just happened, or how it feels. Enter to save, Esc to cancel.<input type="text" maxlength="400" /></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
