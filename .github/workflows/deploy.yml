name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is set to "Deploy from a branch", GitHub also publishes the raw repository on
      # every push, and whichever publish lands last is what the site serves. Let that one
      # finish first, so the built game is always last. (The real fix is Settings -> Pages ->
      # Source -> "GitHub Actions"; then there is nothing to wait for.)
      - name: Wait for any branch-based Pages publish of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.path | startswith("dynamic/pages")) | select(.status != "completed")] | length')
            [ "$busy" = "0" ] && exit 0
            echo "branch-based Pages publish still running; waiting"
            sleep 10
          done
          echo "gave up waiting; deploying anyway"
      - id: deployment
        uses: actions/deploy-pages@v4
